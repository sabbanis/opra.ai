<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600" role="img" aria-labelledby="title desc">
  <title id="title">opra.ai governed operating loop</title>
  <desc id="desc">A system diagram showing how humans and agents submit intent through interfaces, governance validates the change, GitHub reviews and records evidence, source objects hold company state, and dashboards and Skills read from the same governed source of truth.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f"/>
      <stop offset="52%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#152016"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a7f3d0"/>
    </marker>
    <style>
      .bg { fill: url(#bg); }
      .grid { stroke: rgba(255,255,255,0.06); stroke-width: 1; }
      .headline { font: 800 56px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .subhead { font: 500 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .label { font: 800 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; letter-spacing: 0; }
      .small { font: 500 17px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; letter-spacing: 0; }
      .tiny { font: 650 14px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dbeafe; letter-spacing: 0.06em; }
      .card { fill: rgba(15,23,42,0.86); stroke: rgba(148,163,184,0.36); stroke-width: 1.4; rx: 8; filter: url(#softShadow); }
      .hot { fill: rgba(127,29,29,0.34); stroke: rgba(251,113,133,0.54); stroke-width: 1.4; rx: 8; }
      .good { fill: rgba(6,78,59,0.34); stroke: rgba(52,211,153,0.6); stroke-width: 1.4; rx: 8; }
      .core { fill: rgba(2,6,23,0.88); stroke: url(#cyan); stroke-width: 2.2; rx: 8; filter: url(#softShadow); }
      .pipe { fill: none; stroke: #a7f3d0; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); opacity: 0.88; }
      .mutedPipe { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 7 9; opacity: 0.8; }
      .chip { fill: rgba(255,255,255,0.08); stroke: rgba(255,255,255,0.16); stroke-width: 1; rx: 8; }
      .accent { fill: url(#cyan); }
      .warn { fill: url(#amber); }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1600"/>

  <g opacity="0.72">
    <path class="grid" d="M 80 120 H 1520"/>
    <path class="grid" d="M 80 240 H 1520"/>
    <path class="grid" d="M 80 360 H 1520"/>
    <path class="grid" d="M 80 480 H 1520"/>
    <path class="grid" d="M 80 600 H 1520"/>
    <path class="grid" d="M 80 720 H 1520"/>
    <path class="grid" d="M 80 840 H 1520"/>
    <path class="grid" d="M 80 960 H 1520"/>
    <path class="grid" d="M 80 1080 H 1520"/>
    <path class="grid" d="M 80 1200 H 1520"/>
    <path class="grid" d="M 80 1320 H 1520"/>
    <path class="grid" d="M 80 1440 H 1520"/>
    <path class="grid" d="M 220 80 V 1520"/>
    <path class="grid" d="M 440 80 V 1520"/>
    <path class="grid" d="M 660 80 V 1520"/>
    <path class="grid" d="M 880 80 V 1520"/>
    <path class="grid" d="M 1100 80 V 1520"/>
    <path class="grid" d="M 1320 80 V 1520"/>
  </g>

  <text x="80" y="92" class="headline">opra.ai Governed Operating Loop</text>
  <text x="82" y="132" class="subhead">Human and agent workflows through policy, review, source objects, and audit evidence.</text>

  <g transform="translate(80 240)">
    <rect class="hot" width="470" height="300"/>
    <text x="28" y="44" class="tiny">OLD SAAS BARGAIN</text>
    <text x="28" y="82" class="label">The app owns the truth</text>
    <text x="28" y="122" class="small">Data lives behind product screens.</text>
    <text x="28" y="154" class="small">Workflow logic hides in vendor state.</text>
    <text x="28" y="186" class="small">Agents depend on brittle APIs, exports,</text>
    <text x="28" y="216" class="small">screenshots, or human memory.</text>
    <text x="28" y="258" class="small">Audit gets reconstructed after the fact.</text>
  </g>

  <g transform="translate(80 620)">
    <rect class="good" width="470" height="300"/>
    <text x="28" y="44" class="tiny">AGENTIC OPERATING MODEL</text>
    <text x="28" y="82" class="label">The repo owns the truth</text>
    <text x="28" y="122" class="small">Business records are source objects.</text>
    <text x="28" y="154" class="small">Policy runs before mutation.</text>
    <text x="28" y="186" class="small">GitHub records review and evidence.</text>
    <text x="28" y="216" class="small">Humans and agents use one path.</text>
    <text x="28" y="258" class="small">Apps become interfaces over memory.</text>
  </g>

  <g transform="translate(650 240)">
    <rect class="core" width="420" height="188"/>
    <text x="30" y="44" class="tiny">INTENT</text>
    <text x="30" y="82" class="label">Human or agent asks for change</text>
    <text x="30" y="122" class="small">"Move Acme to renewal_due"</text>
    <text x="30" y="153" class="small">"Summarize pipeline risk"</text>
    <g transform="translate(30 164)">
      <rect class="chip" width="70" height="32"/>
      <text x="17" y="22" class="small">CLI</text>
      <rect class="chip" x="86" width="70" height="32"/>
      <text x="107" y="22" class="small">API</text>
      <rect class="chip" x="172" width="88" height="32"/>
      <text x="190" y="22" class="small">UI</text>
      <rect class="chip" x="276" width="102" height="32"/>
      <text x="294" y="22" class="small">Skills</text>
    </g>
  </g>

  <g transform="translate(1120 240)">
    <rect class="card" width="400" height="188"/>
    <text x="30" y="44" class="tiny">GOVERNANCE GATE</text>
    <text x="30" y="82" class="label">No write before policy</text>
    <text x="30" y="122" class="small">Schema validation</text>
    <text x="30" y="153" class="small">RBAC, lifecycle, approval policy</text>
  </g>

  <g transform="translate(1120 560)">
    <rect class="card" width="400" height="220"/>
    <text x="30" y="44" class="tiny">GITHUB CONTROL PLANE</text>
    <text x="30" y="82" class="label">Review becomes evidence</text>
    <text x="30" y="122" class="small">Proposal artifacts</text>
    <text x="30" y="153" class="small">Pull requests, CODEOWNERS, Actions</text>
    <text x="30" y="184" class="small">Review approvals mapped into audit</text>
  </g>

  <g transform="translate(650 1040)">
    <rect class="core" width="420" height="188"/>
    <text x="30" y="44" class="tiny">SOURCE OF TRUTH</text>
    <text x="30" y="82" class="label">Company state as files</text>
    <text x="30" y="122" class="small">Accounts, opportunities, workflows</text>
    <text x="30" y="153" class="small">Audit events, hashes, evidence</text>
  </g>

  <g transform="translate(650 600)">
    <rect class="card" width="420" height="220"/>
    <text x="30" y="44" class="tiny">READ AND OPERATE</text>
    <text x="30" y="82" class="label">One governed memory layer</text>
    <text x="30" y="122" class="small">Read models power dashboards</text>
    <text x="30" y="153" class="small">Skills answer from source state</text>
    <text x="30" y="184" class="small">Agents act through the same controls</text>
  </g>

  <path class="pipe" d="M 1070 334 C 1090 334 1100 334 1116 334"/>
  <path class="pipe" d="M 1320 428 C 1320 478 1320 506 1320 556"/>
  <path class="pipe" d="M 1120 672 C 1096 672 1092 672 1074 672"/>
  <path class="pipe" d="M 860 820 C 860 900 860 956 860 1036"/>
  <path class="pipe" d="M 650 1138 C 590 1138 560 1068 560 968 C 560 830 604 724 646 692"/>
  <path class="mutedPipe" d="M 550 382 C 592 342 606 330 646 316"/>
  <path class="mutedPipe" d="M 550 760 C 596 716 612 700 646 684"/>

  <g transform="translate(1120 1040)">
    <rect class="chip" width="400" height="142"/>
    <text x="28" y="38" class="label">The first-principles shift</text>
    <text x="28" y="72" class="small">Apps become interfaces.</text>
    <text x="28" y="104" class="small">The governed repo becomes memory.</text>
  </g>

  <g transform="translate(80 1420)">
    <rect x="0" y="0" width="1428" height="58" rx="8" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.14)"/>
    <text x="24" y="37" class="small">opra.ai: intent -> policy -> proposal -> PR review -> source objects -> audit evidence -> dashboards + Skills</text>
    <text x="1210" y="37" class="small">github.com/sabbanis/opra.ai</text>
  </g>

  <circle cx="1508" cy="90" r="9" class="accent"/>
  <circle cx="1478" cy="90" r="9" class="warn"/>
  <circle cx="1448" cy="90" r="9" fill="#93c5fd"/>
</svg>
