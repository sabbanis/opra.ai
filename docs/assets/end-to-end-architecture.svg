<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
  <title id="title">opra.ai end-to-end architecture</title>
  <desc id="desc">Browser, local API, core services, repository state, GitHub integration, and audit evidence architecture.</desc>
  <defs>
    <marker id="arrow" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="3">
      <path d="M0,0 L8,3 L0,6 Z" fill="#115e59"/>
    </marker>
    <style>
      .page { fill: #f4f6f8; }
      .zone { fill: #ffffff; stroke: #d9e1e6; stroke-width: 2; }
      .zone-title { fill: #172026; font: 800 20px Inter, Arial, sans-serif; }
      .title { fill: #172026; font: 800 34px Inter, Arial, sans-serif; }
      .subtitle { fill: #64727c; font: 500 15px Inter, Arial, sans-serif; }
      .box { fill: #f9fbfc; stroke: #d9e1e6; stroke-width: 2; }
      .box-title { fill: #172026; font: 800 15px Inter, Arial, sans-serif; }
      .box-text { fill: #64727c; font: 500 12px Inter, Arial, sans-serif; }
      .line { stroke: #115e59; stroke-width: 2.5; marker-end: url(#arrow); fill: none; }
      .muted-line { stroke: #94a3ad; stroke-width: 2; marker-end: url(#arrow); fill: none; }
      .teal { fill: #0f766e; }
      .blue { fill: #2457a6; }
      .amber { fill: #a16207; }
      .rose { fill: #9f1239; }
      .green { fill: #13795b; }
      .white { fill: #ffffff; }
      .chip { font: 800 11px Inter, Arial, sans-serif; }
    </style>
  </defs>
  <rect class="page" width="1300" height="760"/>
  <text class="title" x="44" y="58">opra.ai End-to-End Architecture</text>
  <text class="subtitle" x="44" y="84">Local-first Company OS: browser UI, local API, core governance services, repository state, GitHub publishing, and audit evidence.</text>

  <g transform="translate(38 120)">
    <rect class="zone" x="0" y="0" width="264" height="560" rx="8"/>
    <text class="zone-title" x="20" y="38">User Surface</text>
    <rect class="box" x="20" y="64" width="224" height="84" rx="8"/>
    <rect class="teal" x="20" y="64" width="224" height="7" rx="4"/>
    <text class="box-title" x="38" y="98">Browser UI</text>
    <text class="box-text" x="38" y="122">Sign-in, onboarding, modules</text>
    <rect class="box" x="20" y="174" width="224" height="84" rx="8"/>
    <rect class="blue" x="20" y="174" width="224" height="7" rx="4"/>
    <text class="box-title" x="38" y="208">Persona Views</text>
    <text class="box-text" x="38" y="232">Customers, Delivery, People</text>
    <rect class="box" x="20" y="284" width="224" height="84" rx="8"/>
    <rect class="amber" x="20" y="284" width="224" height="7" rx="4"/>
    <text class="box-title" x="38" y="318">Workbench</text>
    <text class="box-text" x="38" y="342">CRUD, validate, policy check</text>
  </g>

  <g transform="translate(350 120)">
    <rect class="zone" x="0" y="0" width="282" height="560" rx="8"/>
    <text class="zone-title" x="20" y="38">Local API</text>
    <rect class="box" x="22" y="64" width="238" height="78" rx="8"/>
    <rect class="teal" x="22" y="64" width="238" height="7" rx="4"/>
    <text class="box-title" x="40" y="96">Auth Routes</text>
    <text class="box-text" x="40" y="120">login, register, session</text>
    <rect class="box" x="22" y="166" width="238" height="78" rx="8"/>
    <rect class="blue" x="22" y="166" width="238" height="7" rx="4"/>
    <text class="box-title" x="40" y="198">Read Routes</text>
    <text class="box-text" x="40" y="222">modules, objects, CRM, audit</text>
    <rect class="box" x="22" y="268" width="238" height="78" rx="8"/>
    <rect class="amber" x="22" y="268" width="238" height="7" rx="4"/>
    <text class="box-title" x="40" y="300">Mutation Routes</text>
    <text class="box-text" x="40" y="324">validate, write, proposals</text>
    <rect class="box" x="22" y="370" width="238" height="78" rx="8"/>
    <rect class="rose" x="22" y="370" width="238" height="7" rx="4"/>
    <text class="box-title" x="40" y="402">Publishing Routes</text>
    <text class="box-text" x="40" y="426">PR and issue previews</text>
  </g>

  <g transform="translate(680 120)">
    <rect class="zone" x="0" y="0" width="286" height="560" rx="8"/>
    <text class="zone-title" x="20" y="38">Core Services</text>
    <rect class="box" x="22" y="64" width="242" height="76" rx="8"/>
    <rect class="teal" x="22" y="64" width="242" height="7" rx="4"/>
    <text class="box-title" x="40" y="96">RBAC + Policy</text>
    <text class="box-text" x="40" y="120">roles, scopes, approvals</text>
    <rect class="box" x="22" y="162" width="242" height="76" rx="8"/>
    <rect class="blue" x="22" y="162" width="242" height="7" rx="4"/>
    <text class="box-title" x="40" y="194">Object Store</text>
    <text class="box-text" x="40" y="218">path map and YAML objects</text>
    <rect class="box" x="22" y="260" width="242" height="76" rx="8"/>
    <rect class="amber" x="22" y="260" width="242" height="7" rx="4"/>
    <text class="box-title" x="40" y="292">Mutation Service</text>
    <text class="box-text" x="40" y="316">validate, evaluate, commit</text>
    <rect class="box" x="22" y="358" width="242" height="76" rx="8"/>
    <rect class="rose" x="22" y="358" width="242" height="7" rx="4"/>
    <text class="box-title" x="40" y="390">Proposal Service</text>
    <text class="box-text" x="40" y="414">approve, reject, apply</text>
    <rect class="box" x="22" y="456" width="242" height="76" rx="8"/>
    <rect class="green" x="22" y="456" width="242" height="7" rx="4"/>
    <text class="box-title" x="40" y="488">Audit Writer</text>
    <text class="box-text" x="40" y="512">event evidence files</text>
  </g>

  <g transform="translate(1014 120)">
    <rect class="zone" x="0" y="0" width="248" height="560" rx="8"/>
    <text class="zone-title" x="20" y="38">State + Integrations</text>
    <rect class="box" x="20" y="64" width="208" height="70" rx="8"/>
    <rect class="teal" x="20" y="64" width="208" height="7" rx="4"/>
    <text class="box-title" x="38" y="94">Identity Store</text>
    <text class="box-text" x="38" y="116">platform/identity/users.json</text>
    <rect class="box" x="20" y="154" width="208" height="70" rx="8"/>
    <rect class="blue" x="20" y="154" width="208" height="7" rx="4"/>
    <text class="box-title" x="38" y="184">Module Objects</text>
    <text class="box-text" x="38" y="206">modules/*/objects/*.yaml</text>
    <rect class="box" x="20" y="244" width="208" height="70" rx="8"/>
    <rect class="amber" x="20" y="244" width="208" height="7" rx="4"/>
    <text class="box-title" x="38" y="274">Proposals</text>
    <text class="box-text" x="38" y="296">platform/proposals</text>
    <rect class="box" x="20" y="334" width="208" height="70" rx="8"/>
    <rect class="green" x="20" y="334" width="208" height="7" rx="4"/>
    <text class="box-title" x="38" y="364">Audit Events</text>
    <text class="box-text" x="38" y="386">platform/audit/events</text>
    <rect class="box" x="20" y="424" width="208" height="70" rx="8"/>
    <rect class="rose" x="20" y="424" width="208" height="7" rx="4"/>
    <text class="box-title" x="38" y="454">GitHub Optional</text>
    <text class="box-text" x="38" y="476">git, gh, Actions, PRs</text>
  </g>

  <path class="line" d="M302 240 C326 240 326 240 350 240"/>
  <path class="line" d="M632 240 C656 240 656 240 680 240"/>
  <path class="line" d="M966 240 C990 240 990 240 1014 240"/>
  <path class="muted-line" d="M492 448 C492 704 1120 704 1120 494"/>
  <path class="muted-line" d="M826 532 C826 716 1120 716 1120 404"/>
  <path class="muted-line" d="M826 434 C826 698 1120 698 1120 314"/>

  <g transform="translate(44 710)">
    <circle class="teal" cx="10" cy="10" r="10"/>
    <text class="box-text" x="28" y="14">Trust boundary: browser to local API</text>
    <circle class="amber" cx="284" cy="10" r="10"/>
    <text class="box-text" x="302" y="14">Governance boundary: policy before commit</text>
    <circle class="rose" cx="604" cy="10" r="10"/>
    <text class="box-text" x="622" y="14">Integration boundary: optional GitHub publishing</text>
  </g>
</svg>
